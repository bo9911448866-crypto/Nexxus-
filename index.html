<!doctype html>
<html lang="en" class="dark bg-black text-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexxus</title>
    <meta name="description" content="High-performance black and white gaming platform featuring all games from monkeygg2." />
    <meta property="og:title" content="Nexxus" />
    <meta property="og:description" content="High-performance black and white gaming platform featuring all games from monkeygg2." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script>
      // Cleanly filter out development Vite HMR WebSocket connection notices in cloud container environments
      (function() {
        function isViteWsError(errOrMsg) {
          if (!errOrMsg) return false;
          var str = typeof errOrMsg === 'string' ? errOrMsg : (errOrMsg.message || errOrMsg.reason || '');
          return typeof str === 'string' && (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('vite-hmr') !== -1 ||
            str.indexOf('closed without opened') !== -1
          );
        }

        // Catch and prevent unhandled error events from popping up in the preview overlay
        window.addEventListener('error', function(e) {
          if (isViteWsError(e.message) || isViteWsError(e.error)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteWsError(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);

        // Filter console noise
        var _origError = console.error;
        var _origWarn = console.warn;
        console.error = function() {
          var msg = arguments && arguments[0];
          if (isViteWsError(msg)) return;
          return _origError.apply(console, arguments);
        };
        console.warn = function() {
          var msg = arguments && arguments[0];
          if (isViteWsError(msg)) return;
          return _origWarn.apply(console, arguments);
        };

        // Shim WebSocket for Vite's HMR client so it connects cleanly without failing
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          function MockViteHmrSocket(url, protocols) {
            var isHmr = (protocols === 'vite-hmr') ||
                        (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                        (typeof url === 'string' && (url.indexOf('/@vite/') !== -1 || url.indexOf('token=') !== -1));

            if (!isHmr) {
              try {
                return new RealWebSocket(url, protocols);
              } catch (e) {
                // fall through if real socket fails
              }
            }

            var target = new EventTarget();
            target.url = url;
            target.readyState = 1; // OPEN
            target.bufferedAmount = 0;
            target.protocol = 'vite-hmr';
            target.extensions = '';
            target.binaryType = 'blob';
            target.send = function() {};
            target.close = function(code, reason) {
              target.readyState = 3; // CLOSED
              var ev = new Event('close');
              ev.wasClean = true;
              ev.code = code || 1000;
              ev.reason = reason || '';
              if (typeof target.onclose === 'function') target.onclose(ev);
              target.dispatchEvent(ev);
            };

            setTimeout(function() {
              target.readyState = 1;
              var ev = new Event('open');
              if (typeof target.onopen === 'function') target.onopen(ev);
              target.dispatchEvent(ev);
            }, 10);

            return target;
          }

          MockViteHmrSocket.CONNECTING = 0;
          MockViteHmrSocket.OPEN = 1;
          MockViteHmrSocket.CLOSING = 2;
          MockViteHmrSocket.CLOSED = 3;
          MockViteHmrSocket.prototype = RealWebSocket.prototype;
          window.WebSocket = MockViteHmrSocket;
        }
      })();
    </script>
    <style>
      body {
        background-color: #000000;
        color: #ffffff;

      }

        background: #27272a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }
    </style>
    <!-- Ultraviolet Client Scripts -->

    <script src="/uv/uv.config.js" defer></script>
  </head>

  </body>
