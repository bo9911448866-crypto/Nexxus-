<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="3;url=https://nexxus.live" />
    <title>Nexxus has moved</title>
    <meta name="description" content="Nexxus has moved to a new domain." />
    <style>
      :root { color-scheme: dark; }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main { padding: 2rem; }
      h1 { margin: 0 0 0.75rem; font-size: clamp(1.75rem, 5vw, 3rem); }
      p { color: #a1a1aa; }
      a { color: #fff; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>This website is no longer active.</h1>
      <p>Nexxus has moved to a new domain.</p>
      <p>Redirecting you to <a href="https://nexxus.live">nexxus.live</a>…</p>
    </main>
    <script>
      window.setTimeout(function () {
        window.location.replace('https://nexxus.live');
      }, 3000);
    </script>
  </body>
</html>
